[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "effr-forecasting"
version = "1.0.0"
description = "Reproducible monthly EFFR forecasting benchmark"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "pandas==2.2.3", "scikit-learn==1.6.1", "matplotlib==3.10.3"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
effr-train = "effr_forecasting.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
